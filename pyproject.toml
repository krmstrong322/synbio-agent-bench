[project]
name = "synbio-bench"
version = "0.1.0"
description = "Model-agnostic agent benchmark for synthetic biology design tasks (DNA origami: scadnano + oxDNA)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scadnano>=0.21.1",
]

[project.scripts]
synbio-bench = "synbio_bench.runner:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synbio_bench"]
