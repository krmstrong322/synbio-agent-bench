[project]
name = "synbio-bench"
version = "0.1.0"
description = "DNA origami design agent (scadnano) and the internal benchmark that grades it with oxDNA"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.32",
    "langchain>=1.4.7",
    "langchain-anthropic>=1.7.7",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scadnano>=0.21.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
modal = ["modal>=1.6"]  # mode: modal in configs/oxdna.yaml (oxDNA on Modal cloud GPUs)

[project.scripts]
synbio-bench = "synbio_bench.runner:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/origami_agent", "src/synbio_bench"]
