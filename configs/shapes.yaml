# Flat-shape scaling study: shape x scaffold size, plus Rothemund's literature rectangles.
# Regenerate the task files with: uv run python scripts/make_shape_tasks.py
name: origami-shapes-v1
tasks:
  - origami-shapes/rectangle-500
  - origami-shapes/rectangle-1000
  - origami-shapes/rectangle-2000
  - origami-shapes/rectangle-4000
  - origami-shapes/rectangle-7000
  - origami-shapes/triangle-500
  - origami-shapes/triangle-1000
  - origami-shapes/triangle-2000
  - origami-shapes/triangle-4000
  - origami-shapes/triangle-7000
  - origami-shapes/disk-500
  - origami-shapes/disk-1000
  - origami-shapes/disk-2000
  - origami-shapes/disk-4000
  - origami-shapes/disk-7000
  - origami-shapes/star-2000
  - origami-shapes/star-4000
  - origami-shapes/star-7000
  - origami-rothemund/rectangle
  - origami-rothemund/tall-rectangle
models: [claude-haiku-5-5, deepseek-v4.1-flash]
repeats: 1
agent:
  max_simulations: 4
  recursion_limit: 400
  wall_timeout_s: 5400       # large shapes need longer scripts and slower simulations
  script_timeout_s: 300
evaluation:
  protocol: shape            # ~20 min per full-M13 design on a GTX 1660 (standard: ~95 min)
  seeds: [1]
  # per-task weights (spec/sim/shape = 1/3 each) come from the task files
