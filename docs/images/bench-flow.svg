<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 300" font-family="Helvetica, Arial, sans-serif">
  <rect width="1180" height="300" fill="#ffffff"/>
  <text x="590" y="36" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">How Synbio Agent Bench works</text>

  <!-- boxes -->
  <g font-size="15" fill="#111">
    <rect x="20" y="90" width="180" height="110" rx="10" fill="#eef4ff" stroke="#33507e" stroke-width="2"/>
    <text x="110" y="128" text-anchor="middle" font-weight="bold">Task brief</text>
    <text x="110" y="154" text-anchor="middle" font-size="13">plain-English spec</text>
    <text x="110" y="174" text-anchor="middle" font-size="13">+ size limits</text>

    <rect x="270" y="90" width="220" height="110" rx="10" fill="#eef4ff" stroke="#33507e" stroke-width="2"/>
    <text x="380" y="128" text-anchor="middle" font-weight="bold">Agent harness</text>
    <text x="380" y="154" text-anchor="middle" font-size="13">same prompt, tools, skills</text>
    <text x="380" y="174" text-anchor="middle" font-size="13">and budget for every model</text>

    <rect x="560" y="90" width="180" height="110" rx="10" fill="#eef4ff" stroke="#33507e" stroke-width="2"/>
    <text x="650" y="128" text-anchor="middle" font-weight="bold">scadnano design</text>
    <text x="650" y="154" text-anchor="middle" font-size="13">agent writes + runs</text>
    <text x="650" y="174" text-anchor="middle" font-size="13">Python, then submits</text>

    <rect x="810" y="90" width="160" height="110" rx="10" fill="#fff3e6" stroke="#8a5a1d" stroke-width="2"/>
    <text x="890" y="128" text-anchor="middle" font-weight="bold">Grader: oxDNA</text>
    <text x="890" y="154" text-anchor="middle" font-size="13">physics simulation</text>
    <text x="890" y="174" text-anchor="middle" font-size="13">agent never sees it</text>

    <rect x="1010" y="90" width="150" height="110" rx="10" fill="#eaf7ea" stroke="#2e6b2e" stroke-width="2"/>
    <text x="1085" y="128" text-anchor="middle" font-weight="bold">Score</text>
    <text x="1085" y="154" text-anchor="middle" font-size="13">50% spec</text>
    <text x="1085" y="174" text-anchor="middle" font-size="13">50% simulation</text>
  </g>

  <!-- arrows -->
  <g stroke="#111" stroke-width="2.5" fill="#111">
    <line x1="200" y1="145" x2="262" y2="145"/>
    <polygon points="262,145 250,138 250,152"/>
    <line x1="490" y1="145" x2="552" y2="145"/>
    <polygon points="552,145 540,138 540,152"/>
    <line x1="740" y1="145" x2="802" y2="145"/>
    <polygon points="802,145 790,138 790,152"/>
    <line x1="970" y1="145" x2="1002" y2="145"/>
    <polygon points="1002,145 990,138 990,152"/>
  </g>

  <rect x="270" y="228" width="220" height="40" rx="8" fill="#f2f2f2" stroke="#666"/>
  <text x="380" y="254" text-anchor="middle" font-size="14" fill="#111">Only the model changes: configs/models.yaml</text>
  <line x1="380" y1="200" x2="380" y2="226" stroke="#666" stroke-width="2" stroke-dasharray="5,4"/>
</svg>
