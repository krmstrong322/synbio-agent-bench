id: origami-rothemund/rectangle
title: Rothemund rectangle (24 helices x 288 bp)
difficulty: 4
family: literature
reference: reference_designs/rothemund.py rect
prompt: |
  Design a flat, single-layer DNA origami shaped like a 98 nm x 62 nm rectangle. Fill the shape with parallel helices
  (a raster), as in Rothemund's scaffolded origami.

  This is a recreation of the Rothemund rectangle (24 helices x 288 bp) from Rothemund, Nature 2006: 24 parallel helices of ~288 bp each (about 98 nm x 62 nm), folded from nearly the whole M13mp18 genome.

  Requirements:
  - square lattice; all helices in a single row of the lattice (a flat sheet)
  - a single scaffold strand that is a contiguous fragment of M13mp18, 6600-7249 nt long
  - at least 95% of the scaffold base-paired to staples
  - every staple 16-60 nt long
  - neighbouring helices held together by staple crossovers along their whole length
  - shape fidelity is scored as the intersection-over-union (IoU) between your design's footprint and the ideal
    shape of the same area, at the best rotation and position. For the footprint each base pair is 0.34 nm long
    along its helix and neighbouring helices are 2.6 nm apart. Aim for IoU >= 0.85. The relaxed oxDNA
    structure is scored the same way, so the shape must also hold together physically.

  Save your design under /designs/ and submit it with submit_design.
spec:
  grid: square
  planar: true
  num_helices: 24
  helix_bp:
  - 276
  - 300
  scaffold:
    count: 1
    source: m13
    length:
    - 6600
    - 7249
    min_paired_fraction: 0.95
  staple_length:
  - 16
  - 60
  shape:
    type: rectangle
    aspect: 1.5692
    min_iou: 0.9
weights:
  spec: 0.3333333333333333
  sim: 0.3333333333333333
  shape: 0.3333333333333333
