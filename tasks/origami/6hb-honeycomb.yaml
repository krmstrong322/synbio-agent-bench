id: origami/6hb-honeycomb
title: Six-helix bundle, honeycomb lattice
difficulty: 2
reference: reference_designs/hb6_honeycomb.py
prompt: |
  Design a six-helix bundle (6HB) DNA origami nanotube on the honeycomb lattice: six helices arranged
  in a closed hexagonal ring, each about 126 bp long (about 42 nm).

  Requirements:
  - honeycomb lattice; exactly 6 helices forming a closed ring (each helix touches 2 others)
  - 115-135 base pairs on every helix
  - a single scaffold strand that is a contiguous fragment of M13mp18, 700-820 nt long
  - at least 95% of the scaffold base-paired to staples
  - every staple 18-60 nt long
  - every adjacent pair of helices joined by staple crossovers along its length

  Save your design under /designs/ and submit it with submit_design.
spec:
  grid: honeycomb
  num_helices: 6
  helix_bp: [115, 135]
  min_neighbors_per_helix: 2
  scaffold: {count: 1, source: m13, length: [700, 820], min_paired_fraction: 0.95}
  staple_length: [18, 60]
