experiment:
  agent:
    cost_cap_usd: 5.0
    last_chance_calls: 10
    max_model_calls: 120
    recursion_limit: 1000
    script_timeout_s: 180
    wall_timeout_s: 3600
  evaluation:
    protocol: standard
    seeds:
    - 1
    weights:
      sim: 0.5
      spec: 0.5
  models:
  - claude-opus-5-5
  - claude-sonnet-5-5
  - claude-haiku-5-5
  - gpt-5.5
  name: origami-v1
  repeats: 3
  tasks:
  - origami/4hb-square
  - origami/rect-sheet-8x96
  - origami/6hb-honeycomb
  - origami/12hb-honeycomb
models:
  claude-haiku-5-5:
    id: claude-haiku-5-5
    kwargs:
      max_tokens: 64000
      streaming: true
    model: anthropic:claude-haiku-5-5
    price_per_mtok:
      cache_read: 0.01
      cache_write_1h: 0.2
      cache_write_5m: 0.125
      input: 0.1
      output: 0.5
oxdna:
  backend: CUDA
  executable: /usr/local/bin/oxDNA
  interaction_type: DNA2
  modal:
    app: synbio-oxdna
    environment: null
    gpu: null
    max_parallel: 4
    sims_per_gpu: 3
    volume: synbio-oxdna-runs
  mode: wsl
  protocols:
    quick:
      mc_steps: 1000
      print_every: 10000.0
      prod_steps: 500000.0
      relax_steps: 200000.0
    shape:
      mc_steps: 2000
      print_every: 20000.0
      prod_steps: 1000000.0
      relax_steps: 200000.0
    standard:
      mc_steps: 2000
      print_every: 50000.0
      prod_steps: 5000000.0
      relax_steps: 1000000.0
  salt_concentration: 1.0
  seq_dep_file: null
  temperature: 25C
  timeout_s: 7200
  use_average_seq: true
  verlet_skin: 0.1
  wsl_distro: Ubuntu
